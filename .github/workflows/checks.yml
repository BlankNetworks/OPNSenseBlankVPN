name: Check Blank VPN
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: curl, simplexml
          coverage: none
      - name: Read the package version
        id: package_version
        run: echo "version=$(python3 build/package.py --version)" >> "$GITHUB_OUTPUT"
      - name: Run PHP fixtures and syntax checks
        run: |
          set -eu
          find src tests -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          for test in tests/*.php; do php "$test"; done
          node --check src/opnsense/www/js/blankvpn.js
          node --check tests/ui-fixture.js
          python3 tests/ui_fixture.py --no-sandbox "$(command -v google-chrome)"
          python3 tests/core-archive.py
      - name: Validate generated configurations with the upstream proxy cores
        run: sh tests/check-proxy-cores.sh
      - name: Build and verify package archive
        run: |
          python3 build/package.py --cross --arch amd64
          python3 build/package.py --cross --arch aarch64
          (cd dist && sha256sum -c ./*.pkg.sha256)
          python3 build/release_notes.py --dist dist --repository "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/blank-vpn-release.md"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blank-vpn-opnsense-ce-26.7-source-packages
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish release]')
    needs: checks
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: aarch64
            vm_arch: aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stage pinned FreeBSD runtimes
        env:
          ARCH: ${{ matrix.arch }}
        run: sh build/prepare-release.sh "$RUNNER_TEMP/blankvpn-runtime" "$ARCH"
      - name: Build the downloadable package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 build/package.py --cross --arch "$ARCH" --runtime-dir "$RUNNER_TEMP/blankvpn-runtime"
          cp "$RUNNER_TEMP/blankvpn-runtime/bin/sing-box" "dist/sing-box-$ARCH"
          cd dist
          sha256sum -c "os-blank-vpn-$PACKAGE_VERSION-$ARCH.pkg.sha256"
      - name: Verify package and cores in FreeBSD 15.1
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        with:
          release: "15.1"
          arch: ${{ matrix.vm_arch }}
          envs: PACKAGE_ARCH PACKAGE_VERSION
          copyback: false
          prepare: env ASSUME_ALWAYS_YES=yes pkg bootstrap
          run: sh tests/freebsd-package.sh "dist/os-blank-vpn-$PACKAGE_VERSION-$PACKAGE_ARCH.pkg" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blank-vpn-release-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
            dist/sing-box-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: blank-vpn-release-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -eu
          tag="v$PACKAGE_VERSION"
          notes="$RUNNER_TEMP/blank-vpn-release.md"
          python3 build/release_notes.py --dist dist --repository "$GITHUB_REPOSITORY" > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft,targetCommitish --jq '.isDraft and (.targetCommitish == env.GITHUB_SHA)')" = true
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Blank VPN $PACKAGE_VERSION" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/*.pkg dist/*.pkg.sha256 --clobber
          gh release edit "$tag" --draft=false
      - name: Publish independent sing-box archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 aarch64; do
            sh build/publish-sing-box.sh 1.14.4 "dist/sing-box-$arch" \
              c005f35300ce76427dc285481ec5695f5b179cd2 "$arch"
          done

  package-repository:
    needs: [checks, publish]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: blankvpn-package-repository
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: blank-vpn-release-*
          path: dist
          merge-multiple: true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - name: Prepare the FreeBSD repository builder
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          arch: x86_64
          copyback: false
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap
            pkg install -y python313 ca_root_nss curl
          run: |
            pwd > "$HOME/.blankvpn-repository-workdir"
            test -f build/sign-pkg-repo.sh
      - name: Sign and verify the FreeBSD repository
        env:
          BLANKVPN_REPO_SIGNING_KEY: ${{ secrets.BLANKVPN_REPO_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$BLANKVPN_REPO_SIGNING_KEY"
          sign_command=$(cat <<'REMOTE'
          exec sh -c 'exec sh "$(cat "$HOME/.blankvpn-repository-workdir")/build/sign-pkg-repo.sh" "$1"' sh
          REMOTE
          )
          printf '%s\n' "$BLANKVPN_REPO_SIGNING_KEY" | env -u BLANKVPN_REPO_SIGNING_KEY \
            ssh -T freebsd "$sign_command" "$PACKAGE_VERSION"
          unset BLANKVPN_REPO_SIGNING_KEY
          mkdir _site
          archive_command=$(cat <<'REMOTE'
          exec sh -c 'exec tar -C "$(cat "$HOME/.blankvpn-repository-workdir")/_site" -cf - .'
          REMOTE
          )
          ssh -T freebsd "$archive_command" | tar -xf - -C _site
      - name: Preserve previous package files and prevent an older catalog from replacing a newer one
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: sh build/preserve-pkg-repo.sh _site "$BASE_URL" "$PACKAGE_VERSION"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
      - name: Verify that FreeBSD pkg can authenticate and fetch the published packages
        env:
          BASE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: freebsd {0}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if [ "$(curl -fsS --max-time 10 "${BASE_URL%/}/pkg/26.7/version.txt" 2>/dev/null || :)" = "$PACKAGE_VERSION" ]; then
              break
            fi
            sleep 5
          done
          sh build/verify-pkg-repo.sh - "${BASE_URL%/}" "$PACKAGE_VERSION"
