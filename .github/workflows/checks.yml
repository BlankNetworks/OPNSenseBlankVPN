name: Check Blank VPN
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run PHP fixtures and syntax checks
        run: |
          set -eu
          find src tests -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          for test in tests/*.php; do php "$test"; done
          node --check src/opnsense/www/js/blankvpn.js
          node --check tests/ui-fixture.js
          python3 tests/ui_fixture.py --no-sandbox "$(command -v google-chrome)"
          python3 tests/core-archive.py
      - name: Validate generated configurations with the upstream proxy cores
        run: sh tests/check-proxy-cores.sh
      - name: Build and verify package archive
        run: |
          python3 build/package.py --cross
          cd dist
          sha256sum -c ./*.pkg.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blank-vpn-opnsense-ce-26.7-amd64
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish release]')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stage pinned FreeBSD runtimes
        run: sh build/prepare-release.sh "$RUNNER_TEMP/blankvpn-runtime"
      - name: Build the downloadable package
        run: |
          python3 build/package.py --cross --runtime-dir "$RUNNER_TEMP/blankvpn-runtime"
          cd dist
          sha256sum -c os-blank-vpn-0.5.0.pkg.sha256
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=v0.5.0
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft,targetCommitish --jq '.isDraft and (.targetCommitish == env.GITHUB_SHA)')" = true
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Blank VPN 0.5.0 for OPNsense CE 26.7 amd64" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/os-blank-vpn-0.5.0.pkg dist/os-blank-vpn-0.5.0.pkg.sha256 --clobber
          gh release edit "$tag" --draft=false

      - name: Publish the independent sing-box archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh build/publish-sing-box.sh 1.14.4 "$RUNNER_TEMP/blankvpn-runtime/bin/sing-box" \
            c005f35300ce76427dc285481ec5695f5b179cd2
