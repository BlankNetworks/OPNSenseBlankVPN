[reload]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php reload
parameters:
type:script_output
message:Reloading Blank VPN rules
allowed_groups:wheel

[loaded]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php loaded
parameters:
type:script_output
message:
allowed_groups:wheel

[resolver]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php resolver
parameters:
type:script_output
message:Reconciling Blank VPN DNS listeners
allowed_groups:wheel

[reset_ip]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php reset_ip
parameters: %s
type:script_output
message:Resetting one Blank VPN IPv4 address
allowed_groups:wheel

[smart_status]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php smart_status
parameters:
type:script_output
message:
allowed_groups:wheel

[proxies]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/BlankVpn/maintenance.php proxies
parameters:
type:script_output
message:Reconciling Blank VPN proxy exits
allowed_groups:wheel
