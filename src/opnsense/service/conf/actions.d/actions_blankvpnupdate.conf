[enable]
command:/usr/local/opnsense/scripts/OPNsense/BlankVpn/package_update.php enable
parameters:
type:script_output
message:Enabling the signed Blank Networks package repository
allowed_groups:wheel

[check]
command:/usr/local/opnsense/scripts/OPNsense/BlankVpn/package_update.php check
parameters:
type:script_output
message:Checking the signed Blank VPN package catalog
allowed_groups:wheel

[apply]
command:/usr/local/opnsense/scripts/OPNsense/BlankVpn/package_update.php apply
parameters: %s
type:script_output
message:Queueing a signed Blank VPN package update
allowed_groups:wheel
